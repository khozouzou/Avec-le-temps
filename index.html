<head>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<style>
body { margin:0; font-family: Inter, sans-serif; background: linear-gradient(135deg,#0f172a,#020617); color:#e5e7eb; }
header{ padding:40px 20px; text-align:center; }
header h1{ font-size:42px; font-weight:800; }
header p{ opacity:.7; }
.container{ max-width:1200px; margin:auto; padding:20px; display:grid; gap:28px; }
.category{ background:#020617cc; border:1px solid #1f2937; border-radius:20px; padding:20px; }
.category h2{ margin-top:0; font-size:22px; }
.mod{ display:flex; justify-content:space-between; align-items:center; background:#020617; border:1px solid #1f2937; padding:14px 16px; border-radius:14px; margin-top:10px; }
.mod-name{ font-weight:600; }
.btns{ display:flex; gap:10px; }
button{ border:none; border-radius:12px; padding:8px 14px; font-weight:600; cursor:pointer; }
.download{ background:#22c55e; color:black; }
.page{ background:#38bdf8; color:black; }
.bulk{ background:#a78bfa; color:black; padding:14px 22px; font-size:16px; border-radius:16px; }
#progressBox{ max-width:600px; margin:20px auto 0; display:none; }
.progress-bar{ width:100%; height:18px; background:#111827; border-radius:999px; overflow:hidden; border:1px solid #1f2937; }
.progress-fill{ height:100%; width:0%; background:#22c55e; transition:width .2s ease; }
#progressText{ margin-top:8px; font-size:14px; opacity:.8; }
footer{ text-align:center; opacity:.6; padding:30px; }
</style>
</head>
<body>

<header>
  <h1>⚡ Fabric Mod Pack</h1>
  <p>Download individual mods or grab the full pack instantly</p>
  <button class="bulk" onclick="downloadAll()">Download Full Pack (ZIP)</button>

  <div id="progressBox">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="progressText">Preparing downloads...</div>
  </div>
</header>

<div class="container" id="mods"></div>
<footer>Built for easy mod sharing • Direct Modrinth downloads</footer>

function niceName(id){
  return id.replace(/[_-]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
}
function fileNameFromUrl(url){
  const part = url.split('/').pop();
  return decodeURIComponent(part);
}

};

function render(){
  const root = document.getElementById('mods');
  Object.entries(categories).forEach(([cat,mods])=>{
    const box=document.createElement('div');
    box.className='category';
    box.innerHTML=`<h2>${cat}</h2>`;
    mods.forEach(m=>{
      const el=document.createElement('div');
      el.className='mod';
      el.innerHTML=`
        <div class='mod-name'>${niceName(m[0])}</div>
        <div class='btns'>
          <button class='page' onclick="window.open('${m[2]}','_blank')">Modrinth</button>
          <button class='download' onclick="downloadOne('${m[1]}')">Download</button>
        </div>`;
      box.appendChild(el);
    });
    root.appendChild(box);
  });
}

function downloadOne(url){ const a=document.createElement('a'); a.href=url; a.download=''; a.click(); }

function setProgress(done,total,name){
  const pct = Math.round((done/total)*100);
  document.getElementById('progressFill').style.width = pct+"%";
  document.getElementById('progressText').innerText = `Downloading ${name} (${done}/${total}) — ${pct}%`;
}

async function downloadAll(){
  const box = document.getElementById('progressBox');
  box.style.display = 'block';

  const zip=new JSZip();
  const files = Object.values(categories).flat();
  const total = files.length;
  let done = 0;

  for(const m of files){
    try{
      setProgress(done,total,niceName(m[0]));
      const res=await fetch(m[1]);
      if(!res.ok) throw new Error('fail');
      const blob=await res.blob();
      zip.file(fileNameFromUrl(m[1]),blob);
      done++;
      setProgress(done,total,niceName(m[0]));
    }catch(e){
      done++;
      setProgress(done,total,niceName(m[0])+" (skipped)");
    }
  }

  document.getElementById('progressText').innerText = "Building ZIP...";
  const content=await zip.generateAsync({type:"blob"});
  saveAs(content,"mods.zip");
  document.getElementById('progressText').innerText = "Done ✅";
}

render();
</script>
</body>
</html>
