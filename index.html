button {

button:hover {

}

button:disabled {

.page {

.progress-fill {

#progressText {

#status {

footer {

/* =========================================================
   HELPERS
   ========================================================= */

function niceName(id) {
  return id
    .replace(/[_-]/g, " ")
    .replace(/\b\w/g, c => c.toUpperCase());
}


function getFileName(url) {

  try {

    const cleanUrl = url.split("?")[0];

    const lastPart =
      cleanUrl.substring(cleanUrl.lastIndexOf("/") + 1);

    return decodeURIComponent(lastPart);

  } catch {

    return "mod.jar";

  }

}


/*
 * Make sure two files can never have the same name
 * inside the ZIP.
 */
function uniqueFileName(name, usedNames) {

  if (!usedNames.has(name)) {

    usedNames.add(name);

    return name;

  }

  const dot = name.lastIndexOf(".");

  const base =
    dot === -1
      ? name
      : name.substring(0, dot);

  const ext =
    dot === -1
      ? ""
      : name.substring(dot);

  let number = 2;
  let newName = `${base}-${number}${ext}`;

  while (usedNames.has(newName)) {

    number++;

    newName =
      `${base}-${number}${ext}`;

  }

  usedNames.add(newName);

  return newName;

}


function allMods() {

  return Object.values(categories).flat();

}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

  const root =
    document.getElementById("mods");

  root.innerHTML = "";

  Object.entries(categories).forEach(
    ([categoryName, mods]) => {

      const category =
        document.createElement("section");

      category.className = "category";

      const title =
        document.createElement("h2");

      title.textContent = categoryName;

      category.appendChild(title);


      mods.forEach(mod => {

        const row =
          document.createElement("div");

        row.className = "mod";


        const info =
          document.createElement("div");

        const name =
          document.createElement("div");

        name.className = "mod-name";

        name.textContent =
          niceName(mod.id);


        const version =
          document.createElement("span");

        version.className =
          "mod-version";

        version.textContent =
          `v${mod.version}`;


        info.appendChild(name);
        info.appendChild(version);


        const buttons =
          document.createElement("div");

        buttons.className = "btns";


        const pageButton =
          document.createElement("button");

        pageButton.className = "page";

        pageButton.textContent =
          "Modrinth";

        pageButton.onclick = () => {

          window.open(
            mod.page,
            "_blank",
            "noopener,noreferrer"
          );

        };


        const downloadButton =
          document.createElement("button");

        downloadButton.className =
          "download";

        downloadButton.textContent =
          "Download";

        downloadButton.onclick = () =>
          downloadOne(
            mod,
            downloadButton
          );


        buttons.appendChild(pageButton);
        buttons.appendChild(downloadButton);

        row.appendChild(info);
        row.appendChild(buttons);

        category.appendChild(row);

      });


      root.appendChild(category);

    }
  );

}

  const originalText =

  try {

    button.disabled = true;
    button.textContent = "Downloading...";


    const response =
      await fetch(
        mod.file,
        {
          method: "GET",
          mode: "cors",
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const blob =
      await response.blob();


    if (!blob.size) {

      throw new Error(
        "Downloaded file is empty"
      );

    }


    saveAs(
      blob,
      getFileName(mod.file)
    );


  } catch (error) {

    console.error(
      `Failed to download ${mod.id}:`,
      error
    );

    alert(
      `Could not download ${niceName(mod.id)}.\n\n` +
      `If you're opening this HTML directly from your computer, ` +
      `upload it to a web host/server first. Browser CORS restrictions ` +
      `can prevent ZIP downloads from a file:// page.`
    );

  } finally {

    button.disabled = false;
    button.textContent = originalText;

  }

}


/* =========================================================
   PROGRESS
   ========================================================= */

function setProgress(
  completed,
  total,
  text
) {

  const percentage =
    Math.round(
      (completed / total) * 100
    );


  document
    .getElementById("progressFill")
    .style.width =
      `${percentage}%`;


  document
    .getElementById("progressText")
    .textContent =
      `${text} (${completed}/${total}) — ${percentage}%`;

}


/* =========================================================
   FULL ZIP DOWNLOAD
   ========================================================= */

async function downloadAll() {

  const button =
    document.getElementById(
      "bulkButton"
    );

  const progressBox =
    document.getElementById(
      "progressBox"
    );

  const progressText =
    document.getElementById(
      "progressText"
    );

  const status =
    document.getElementById(
      "status"
    );

  const errorList =
    document.getElementById(
      "errorList"
    );


  const mods =
    allMods();


  if (!mods.length) {

    alert(
      "There are no mods in the pack."
    );

    return;

  }


  button.disabled = true;
  button.textContent =
    "Building Pack...";


  progressBox.style.display =
    "block";

  errorList.innerHTML = "";
  status.textContent = "";


  const zip =
    new JSZip();


  const usedNames =
    new Set();


  const failed = [];

  let completed = 0;


  setProgress(
    0,
    mods.length,
    "Preparing downloads..."
  );


  /*
   * Download sequentially rather than firing
   * 38 requests simultaneously.
   *
   * This is slower, but considerably more
   * reliable and easier on the CDN/browser.
   */

  for (const mod of mods) {

    progressText.textContent =
      `Downloading ${niceName(mod.id)}...`;


    try {

      const response =
        await fetch(
          mod.file,
          {
            method: "GET",
            mode: "cors",
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          `HTTP ${response.status}`
        );

      }


      const blob =
        await response.blob();


      if (!blob.size) {

        throw new Error(
          "Empty response"
        );

      }


      const originalName =
        getFileName(mod.file);


      const fileName =
        uniqueFileName(
          originalName,
          usedNames
        );


      zip.file(
        fileName,
        blob
      );


    } catch (error) {

      console.error(
        `Failed: ${mod.id}`,
        error
      );


      failed.push({
        id: mod.id,
        error: error.message
      });

    }


    completed++;


    setProgress(
      completed,
      mods.length,
      failed.length
        ? `Downloaded ${niceName(mod.id)}`
        : `Downloaded ${niceName(mod.id)}`
    );

  }


  /* =======================================================
     HANDLE FAILURES
     ======================================================= */

  if (failed.length) {

    status.textContent =
      `${failed.length} mod(s) failed to download.`;


    failed.forEach(item => {

      const li =
        document.createElement("li");

      li.textContent =
        `✕ ${niceName(item.id)} — ${item.error}`;

      errorList.appendChild(li);

    });


    button.disabled = false;

    button.textContent =
      "Retry Full Pack (ZIP)";


    progressText.textContent =
      "Download finished with errors.";


    /*
     * Important:
     *
     * Don't silently generate a partial ZIP.
     *
     * The user should know that something
     * went wrong before receiving the pack.
     */

    alert(
      `${failed.length} mod(s) could not be downloaded.\n\n` +
      `The ZIP was NOT created so you don't accidentally install an incomplete pack.\n\n` +
      `Check the error list below and try again.`
    );

    return;

  }


  /* =======================================================
     GENERATE ZIP
     ======================================================= */

  progressText.textContent =
    "All mods downloaded. Building ZIP...";

  status.textContent =
    `${mods.length} mods ready.`;


  try {

    const zipBlob =
      await zip.generateAsync(
        {
          type: "blob",

          compression: "DEFLATE",

          compressionOptions: {
            level: 6
          }
        },

        metadata => {

          const zipPercent =
            Math.round(
              metadata.percent
            );


          document
            .getElementById(
              "progressFill"
            )
            .style.width =
              `${zipPercent}%`;


          progressText.textContent =
            `Building ZIP... ${zipPercent}%`;

        }

      );


    /*
     * Download the finished ZIP.
     */

    saveAs(
      zipBlob,
      "Fabric-26.2-Mod-Pack.zip"
    );


    progressText.textContent =
      "Done! ZIP downloaded successfully ✅";


    status.textContent =
      `${mods.length} mods packed successfully.`;


    document
      .getElementById(
        "progressFill"
      )
      .style.width =
        "100%";


    button.textContent =
      "Download Full Pack Again";


  } catch (error) {

    console.error(
      "ZIP generation failed:",
      error
    );


    progressText.textContent =
      "ZIP generation failed ❌";


    status.textContent =
      error.message;


    alert(
      "The mods downloaded, but the ZIP could not be created.\n\n" +
      error.message
    );


    button.textContent =
      "Try ZIP Again";

  }


  button.disabled = false;

}


/* =========================================================
   START
   ========================================================= */

render();

</script>

</body>
</html>
